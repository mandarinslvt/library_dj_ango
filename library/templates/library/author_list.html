<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список авторов</title>
</head>
<body>
    <h1>Наши авторы</h1>
    <ul>
    {% for author in authors %}
        <li>
            <!-- ФИО — ссылка на страницу автора -->
            <a href="{% url 'library:author_detail' author.pk %}"><strong>{{ author.first_name }} {{ author.last_name }}</strong></a> 
            {% if author.birth_date %}(Дата рождения: {{ author.birth_date }}){% endif %} — 
            Количество книг: {{ author.books_count }}
        </li>
    {% empty %}
        <p>Авторов пока нет.</p>
    {% endfor %}
    </ul>
    <p><a href="{% url 'library:book_list' %}">К списку книг</a></p>
</body>
</html>
