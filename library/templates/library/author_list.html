<!DOCTYPE html>
<html lang="ru">
<head><title>Список авторов</title></head>
<body>
    <h1>Наши авторы</h1>
    <ul>
    {% for author in authors %}
        <li>
            <a href="{% url 'library:author_detail' author.pk %}"><strong>{{ author.fio }}</strong></a><br>
            {% if author.birth_date %}
                Дата рождения: {{ author.birth_date }}<br>
            {% endif %}
            Количество книг в базе: {{ author.books_count }}
        </li>
        <hr>
    {% endfor %}
    </ul>
</body>
</html>
